apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: edge-time-out-continue-error-true
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
jobs:
  build:
    runs-on:
      - jany-label-3
    steps:
      - name: Say hello
        timeout-minutes: 1
        continue-on-error: true
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world "
      - name: second step after time out
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world after time out + coe true"
