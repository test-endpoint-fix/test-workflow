apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: [jany-label-3]
    steps:
      - name: Say hello with timeout
        timeout-minutes: 1
        # note: uses is only supported when running in container based execution mode
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world " && sleep 100
      - name: Get version
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world after time out"
         
