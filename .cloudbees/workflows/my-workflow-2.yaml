apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
jobs:
  build:
    steps:
      - name: Say hello
        timeout-minutes: 1
        continue-on-error: true
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world step1 and wait for timeout.." && sleep 100
      - name: Say hello second time
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world step 2"