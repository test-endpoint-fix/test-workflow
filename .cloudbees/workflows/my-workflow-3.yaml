apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
jobs:
  build:
    steps:
      - name: Say hello
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world" && sleep 2
      - name: Say hello second time
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "hello world step 2"