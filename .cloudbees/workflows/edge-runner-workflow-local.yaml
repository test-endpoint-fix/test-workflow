apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: edge-job-timeout-continue-on-error
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
jobs:
  timeout-step:
    runs-on: [jany-label-3]
    steps:
      - name: timeout-step
        timeout-minutes: 1
        continue-on-error: true
        run: |
          echo "hello world" && sleep 100

      - name: step after timeout
        run: |
          echo "hello world"
         
